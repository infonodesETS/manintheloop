# Controllo dei segreti e dei dati personali su tutte le pull request verso
# main (piano, F5.3): scripts/checks/check_secrets_paths.py.
#
# A differenza di check-pr.yml non ha il filtro sui percorsi (decisione di
# Nelson, 2026-11-27): il rischio di scrivere un percorso personale, un'email
# o una chiave è più alto proprio nelle PR di sola documentazione
# (STATUS.md, log, piano).

name: Segreti e percorsi

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: segreti e percorsi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Nessun segreto né percorso personale nei file del repo
        run: python3 scripts/checks/check_secrets_paths.py
