# Controlli automatici sulle pull request verso main (piano, fase F5).
#
# Controlli: scripts/validate.py sul database del sito (F5.7) e
# scripts/checks/check_site_refs.py, i file locali richiamati dalle pagine (F5.1),
# scripts/checks/check_site_clean.py, solo file del sito in docs/ (F5.2);
# scripts/sync_site_data.py --check, docs/data/edf_calls.json identico a
# rawdata/edf_calls.json (F5.6);
# scripts/checks/check_index.py, indice MARLA coerente con il database (F5.4):
# blocca se l'indice è rotto, avvisa senza bloccare se è solo vecchio.
# Parte solo se la PR tocca il sito (docs/), gli script, rawdata/edf_calls.json
# (sorgente della copia servita dal sito) o questo file
# (decisione di Nelson, 2026-11-27): le PR di sola documentazione
# (STATUS.md, reference/) non lo fanno partire.
#
# Attenzione: se un giorno questo controllo diventa obbligatorio per il merge
# (regola su main nelle impostazioni, oggi rimandata: decisione D3), il filtro
# `paths` va tolto o cambiato, altrimenti le PR di sola documentazione restano
# in attesa di un controllo che non parte.

name: Controlli PR

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/**"
      - "rawdata/edf_calls.json"
      - "work/qid-rimessi-noti.json"
      - ".github/workflows/check-pr.yml"

permissions:
  contents: read

jobs:
  validate:
    name: validate.py
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validazione del database
        run: python3 scripts/validate.py
      # gira anche se il passo prima fallisce, così la PR mostra tutti gli errori
      - name: Riferimenti del sito
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_site_refs.py
      - name: Solo file del sito in docs/
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_site_clean.py
      - name: Copia di edf_calls.json
        if: ${{ !cancelled() }}
        run: python3 scripts/sync_site_data.py --check
      - name: Indice MARLA
        if: ${{ !cancelled() }}
        run: python3 scripts/checks/check_index.py
